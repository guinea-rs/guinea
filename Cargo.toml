[workspace.package]
version = "0.29.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/guinea-rs/guinea"

[workspace]
resolver = "2"
members = [
    "crates/guinea-trace",
    "crates/guinea-mark",
    "crates/guinea-meta",
    "crates/guinea-meta-build",
    "crates/guinea-codegen",
    "crates/guinea-core",
    "crates/guinea-app",
    "crates/adapters/guinea-eframe",
    "crates/adapters/guinea-iced",
    "crates/adapters/guinea-ratatui",
    "crates/adapters/guinea-slint",
    "crates/adapters/guinea-slint-build",
    "crates/guinea-router",
    "crates/adapters/guinea-winui",
    "crates/guinea-macros",
    "crates/guinea-route-dsl",
    "crates/guinea",
    "xtask",
]
exclude = ["crates/vendor"]

[workspace.dependencies]
guinea-trace = { path = "crates/guinea-trace", version = "0.29.0" }
guinea-mark = { path = "crates/guinea-mark", version = "0.29.0" }
guinea-meta = { path = "crates/guinea-meta", version = "0.29.0" }
guinea-meta-build = { path = "crates/guinea-meta-build", version = "0.29.0" }
guinea-codegen = { path = "crates/guinea-codegen", version = "0.29.0" }
guinea-core = { path = "crates/guinea-core", version = "0.29.0" }
guinea-app = { path = "crates/guinea-app", version = "0.29.0" }
guinea-eframe = { path = "crates/adapters/guinea-eframe", version = "0.29.0" }
guinea-iced = { path = "crates/adapters/guinea-iced", version = "0.29.0" }
guinea-ratatui = { path = "crates/adapters/guinea-ratatui", version = "0.29.0" }
guinea-slint = { path = "crates/adapters/guinea-slint", version = "0.29.0" }
guinea-slint-build = { path = "crates/adapters/guinea-slint-build", version = "0.29.0" }
guinea-router = { path = "crates/guinea-router", version = "0.29.0" }
guinea-winui = { path = "crates/adapters/guinea-winui", version = "0.29.0" }
guinea-macros = { path = "crates/guinea-macros", version = "0.29.0" }
guinea-route-dsl = { path = "crates/guinea-route-dsl", version = "0.29.0" }
guinea = { path = "crates/guinea", version = "0.29.0" }
inventory = "0.3"

# --- UI Stack (windows-reactor) ---
# windows-rs at 42503b90e has the reactor guinea is written against, and
# crates.io does not: its windows-reactor 0.100.0 is older. The reactor and the
# canvas at that rev are published from crates/vendor as `-pre` crates, under
# their own lib names, on the rest of the windows-rs 0.100 family from
# crates.io - so guinea-winui can be published too.
windows-reactor = { package = "windows-reactor-pre", version = "0.103.0", path = "crates/vendor/windows-reactor-pre" }
windows-core = "0.100.0"

# --- UI Stack (the other backends) ---
# Without their defaults, which pick a renderer: that is the application's
# choice. Each adapter names the features it needs.
eframe = { version = "0.36", default-features = false }
egui = "0.36"
iced = { version = "0.14", default-features = false }
ratatui = "0.30"
crossterm = "0.29"
slint = { version = "1.17", default-features = false }
slint-build = "1.17"
i-slint-backend-testing = "1.17"
windows-sys = "0.61"

# --- Macros ---
proc-macro2 = "1.0"
proc-macro-crate = "3.0"
quote = "1.0"
syn = "3.0"
heck = "0.5"
winnow = "1.0"

# --- Async ---
tokio = { version = "1.49.0", features = ["full"] }
futures-core = "0.3"

# --- Serialization & Data ---
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.0", features = ["v4"] }
toml = "1.1.4"

# --- Logging & Diagnostics ---
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
puffin = "0.20"

# --- Build ---
winresource = "0.1.30"

# --- Utilities ---
anyhow = "1.0.100"
arc-swap = "1.7.1"
derive_more = "2.1.1"
once_cell = "1.21.3"
parking_lot = "0.12.5"
walkdir = "2.5.0"

# --- Tests ---
insta = "1"
tempfile = "3.27.0"

# --- Tools ---
shown = { git = "https://github.com/guinea-rs/shown", tag = "v0.2.0" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
split-debuginfo = "packed"

[profile.dev]
debug = 1
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = 0
