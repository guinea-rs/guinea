[package]
name = "todo-iced"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
guinea = { path = "../../crates/guinea", default-features = false, features = ["own-runtime", "iced"] }
todo-core = { path = "../todo-core" }
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "x11", "wayland"] }
anyhow = "1"

[profile.dev]
debug = 1
incremental = false
codegen-units = 256

[profile.dev.package."*"]
debug = 0
