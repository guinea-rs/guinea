name: deps

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: guinea-rs/.github/.github/workflows/deps-audit.yml@02c22ffa63298c80099e037effd27005e0e78939
    with:
      manifests: '["Cargo.toml", "crates/vendor/windows-window-pre/Cargo.toml", "crates/vendor/windows-reactor-pre/Cargo.toml", "crates/vendor/windows-canvas-pre/Cargo.toml", "examples/todo-core/Cargo.toml", "examples/todo-winui/Cargo.toml", "examples/todo-tui/Cargo.toml", "examples/todo-egui/Cargo.toml", "examples/todo-iced/Cargo.toml", "examples/todo-slint/Cargo.toml"]'

  tags:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    uses: guinea-rs/.github/.github/workflows/deps-tags.yml@02c22ffa63298c80099e037effd27005e0e78939
    with:
      manifests: '["Cargo.toml", "crates/vendor/windows-window-pre/Cargo.toml", "crates/vendor/windows-reactor-pre/Cargo.toml", "crates/vendor/windows-canvas-pre/Cargo.toml", "examples/todo-core/Cargo.toml", "examples/todo-winui/Cargo.toml", "examples/todo-tui/Cargo.toml", "examples/todo-egui/Cargo.toml", "examples/todo-iced/Cargo.toml", "examples/todo-slint/Cargo.toml"]'
