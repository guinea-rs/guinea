[package]
name = "guinea-processes-app-example"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
guinea = { path = "../../crates/guinea" }
processes-core = { path = "../processes-core" }
guinea-core = { path = "../../crates/guinea-core" }
guinea-macros = { path = "../../crates/guinea-macros" }
guinea-plugin-store = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.10.4" }
guinea-widgets = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.10.4" }
guinea-plugin-l10n = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.10.4", features = ["winui"] }
guinea-plugin-devtools = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.10.4" }
guinea-xaml-tap = { path = "../../../guinea-plugins/tools/devtools/xaml-tap" }
anyhow = "1.0"
inventory = "0.3"
tokio = { version = "1", features = ["time", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45" }
windows-canvas = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45", features = [
    "reactor",
] }

# The plugin depends on guinea from git; without this the example would build
# two copies of guinea and the plugin's `PluginBuilder` would be a different
# type from this application's.
[patch."https://github.com/uniproc-dev/guinea"]
guinea = { path = "../../crates/guinea" }
guinea-core = { path = "../../crates/guinea-core" }
guinea-mark = { path = "../../crates/guinea-mark" }

[build-dependencies]
guinea-meta-build = { path = "../../crates/guinea-meta-build" }
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45" }
guinea-codegen = { path = "../../crates/guinea-codegen" }
