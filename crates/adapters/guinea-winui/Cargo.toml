[package]
name = "guinea-winui"
description = "guinea on WinUI through windows-reactor: the router and the application runtime, with Elm inside each node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
guinea-core.workspace = true
guinea-app.workspace = true
guinea-router.workspace = true
guinea-macros.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde = { workspace = true, optional = true }

[features]
# `harness::Mounted` - a page mounted on reactor's recording runtime, with no
# window: its messages, its native tree, and clicks on it, under guinea-app's
# `Harness`.
harness = ["windows-reactor/test", "guinea-app/test-utils", "dep:serde"]

[target.'cfg(target_os = "windows")'.dependencies]
windows-reactor.workspace = true
# For the generated dispatcher bindings in `src/dispatching`. The one the
# reactor is built on, so the COM types are the ones it is already using.
windows-core.workspace = true

[lints]
workspace = true
