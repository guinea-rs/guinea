[package]
name = "windows-reactor-pre"
version = "0.108.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "windows-reactor from microsoft/windows-rs at cd03f9369a896b62151242c1c3321e695df63cfc"
repository = "https://github.com/guinea-rs/guinea"
categories = ["os::windows-apis"]
readme = "readme.md"
exclude = [
    "src/tests",
]

[workspace]

[lib]
name = "windows_reactor"

[features]
test = []

[dependencies]
windows-collections = { version = "0.100.0", default-features = false, features = ["std"] }
windows-core = { version = "0.100.0", default-features = false }
windows-future = { version = "0.100.0", default-features = false }
windows-reference = { version = "0.100.0", default-features = false, features = ["std"] }
windows-threading = { version = "0.100.0", default-features = false }
windows-time = { version = "0.100.0", default-features = false }
windows-window = { package = "windows-window-pre", version = "=0.104.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(windows_slim_errors, windows_cast_diagnostics)'] }

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []

[package.metadata.upstream]
repository = "https://github.com/microsoft/windows-rs"
revision = "cd03f9369a896b62151242c1c3321e695df63cfc"
path = "crates/libs/reactor"
# Only generated COM syntax is lowered to windows-core 0.100. Reactor's
# behavior and public API otherwise follow this revision. The test module
# retains Guinea's Property/SelectionChange/Observation/RetainedGraph exports.

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
debug = 0

[profile.bench]
debug = 0
