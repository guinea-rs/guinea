[package]
name = "todo-egui"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
guinea = { path = "../../crates/guinea", default-features = false, features = ["own-runtime", "eframe"] }
todo-core = { path = "../todo-core" }
egui = "0.36"
anyhow = "1"

[dev-dependencies]
guinea = { path = "../../crates/guinea", default-features = false, features = ["own-runtime", "eframe", "harness"] }

[profile.dev]
debug = 0
incremental = false
codegen-units = 256

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 0

[profile.release]
debug = 0

[profile.bench]
debug = 0
