[package]
name = "processes-eframe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# The same application as the other three front ends: everything that is not
# drawing comes from `processes-core`, unchanged.
guinea = { path = "../../crates/guinea", default-features = false, features = ["eframe"] }
guinea-core = { path = "../../crates/guinea-core" }
guinea-macros = { path = "../../crates/guinea-macros" }
processes-core = { path = "../processes-core" }
guinea-plugin-store = { git = "https://github.com/guinea-rs/guinea-plugins", tag = "v0.19.0" }
guinea-plugin-l10n = { git = "https://github.com/guinea-rs/guinea-plugins", tag = "v0.19.0" }
guinea-plugin-devtools = { git = "https://github.com/guinea-rs/guinea-plugins", tag = "v0.19.0" }
# For `RingSeries` only, which is plain data.
guinea-widgets = { git = "https://github.com/guinea-rs/guinea-plugins", tag = "v0.19.0", default-features = false }
eframe = "0.36"
egui = "0.36"
anyhow = "1.0"
inventory = "0.3"
tokio = { version = "1", features = ["time", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The plugins take guinea from crates.io; without this the example would build
# two copies of guinea and the plugin's `PluginBuilder` would be a different
# type from this application's.
[patch.crates-io]
guinea = { path = "../../crates/guinea" }
guinea-app = { path = "../../crates/guinea-app" }
guinea-codegen = { path = "../../crates/guinea-codegen" }
guinea-core = { path = "../../crates/guinea-core" }
guinea-eframe = { path = "../../crates/adapters/guinea-eframe" }
guinea-macros = { path = "../../crates/guinea-macros" }
guinea-mark = { path = "../../crates/guinea-mark" }
guinea-meta = { path = "../../crates/guinea-meta" }
guinea-meta-build = { path = "../../crates/guinea-meta-build" }
guinea-route-dsl = { path = "../../crates/guinea-route-dsl" }
guinea-router = { path = "../../crates/guinea-router" }
guinea-trace = { path = "../../crates/guinea-trace" }
