[package]
name = "processes-slint"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# The same application as `processes-app` and `processes-tui`: everything that
# is not drawing comes from `processes-core`, unchanged.
guinea = { path = "../../crates/guinea", default-features = false, features = [
    "slint",
    # Dragging and screens come from the winit window under Slint; usable
    # because this crate is the one that picks a renderer, below.
    "slint-winit",
] }
guinea-core = { path = "../../crates/guinea-core" }
guinea-macros = { path = "../../crates/guinea-macros" }
processes-core = { path = "../processes-core" }
guinea-plugin-store = { git = "https://github.com/guinea-rs/guinea-plugins", tag = "v0.26.0" }
guinea-plugin-l10n = { git = "https://github.com/guinea-rs/guinea-plugins", tag = "v0.26.0" }
guinea-plugin-window-state = { git = "https://github.com/guinea-rs/guinea-plugins", tag = "v0.26.0" }
# For `RingSeries` only, which is plain data.
guinea-widgets = { git = "https://github.com/guinea-rs/guinea-plugins", tag = "v0.26.0", default-features = false }
# With a backend and a renderer, unlike the adapter: picking those is the
# application's job. Named rather than left to `default`, which pulls in both
# femtovg and the software renderer and decides between them at startup.
slint = { version = "1.17", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
] }
anyhow = "1.0"
inventory = "0.3"
tokio = { version = "1", features = ["time", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
guinea-slint-build = { path = "../../crates/adapters/guinea-slint-build" }
anyhow = "1.0"

# The plugins take guinea from crates.io; without this the example would build
# two copies of guinea and the plugin's `PluginBuilder` would be a different
# type from this application's.
[patch.crates-io]
guinea = { path = "../../crates/guinea" }
guinea-app = { path = "../../crates/guinea-app" }
guinea-codegen = { path = "../../crates/guinea-codegen" }
guinea-core = { path = "../../crates/guinea-core" }
guinea-macros = { path = "../../crates/guinea-macros" }
guinea-mark = { path = "../../crates/guinea-mark" }
guinea-meta = { path = "../../crates/guinea-meta" }
guinea-meta-build = { path = "../../crates/guinea-meta-build" }
guinea-route-dsl = { path = "../../crates/guinea-route-dsl" }
guinea-router = { path = "../../crates/guinea-router" }
guinea-slint = { path = "../../crates/adapters/guinea-slint" }
guinea-slint-build = { path = "../../crates/adapters/guinea-slint-build" }
guinea-trace = { path = "../../crates/guinea-trace" }
