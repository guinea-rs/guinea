[package]
name = "guinea"
description = "The application layer for Rust GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["gui", "desktop", "framework", "router", "actor"]
categories = ["gui"]

[dependencies]
guinea-core.workspace = true
guinea-app.workspace = true
guinea-router.workspace = true
guinea-macros.workspace = true
guinea-meta.workspace = true

# Nothing else: this crate is re-exports. Anything it appears to need is a
# sign that something which belongs in a real crate ended up here.
guinea-eframe = { workspace = true, optional = true }
guinea-iced = { workspace = true, optional = true }
guinea-ratatui = { workspace = true, optional = true }
guinea-slint = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
guinea-winui = { workspace = true, optional = true }

[features]
default = ["winui", "own-runtime"]

# Backends, each under its own name: `guinea::winui`, `guinea::ratatui`.
winui = ["dep:guinea-winui"]
ratatui = ["dep:guinea-ratatui"]
eframe = ["dep:guinea-eframe"]
iced = ["dep:guinea-iced"]
slint = ["dep:guinea-slint"]
# The parts of the window contract that need the window manager underneath
# Slint. Costs a renderer choice - see `guinea-slint`'s own `winit` feature.
slint-winit = ["slint", "guinea-slint/winit"]

# Let guinea start the async runtime, so an application does not open with
# `Runtime::new()` and an `enter()` guard it has to keep alive by hand.
own-runtime = ["guinea-app/own-runtime"]

# `app::TestApp` - an application without a window, for crates that write
# plugins or features out of tree and need to install them in a test - and
# `app::Harness` with `#[guinea::test]`, which run what those spawn in an
# order a seed decides.
test-utils = ["guinea-app/test-utils"]
# `test-utils`, and each enabled backend's own harness - WinUI and egui -
# without naming the backend's crate.
harness = ["test-utils", "guinea-winui?/harness", "guinea-eframe?/harness"]

[lints]
workspace = true

[dev-dependencies]
amethystate = { version = "0.27", features = ["memory"] }
anyhow.workspace = true
guinea-router.workspace = true
tempfile.workspace = true
inventory.workspace = true
guinea-core = { workspace = true, features = ["test-utils"] }
guinea-app = { workspace = true, features = ["test-utils"] }
insta = { workspace = true, features = ["ron"] }
serde.workspace = true
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-reactor.workspace = true
guinea-winui = { workspace = true, features = ["harness"] }
