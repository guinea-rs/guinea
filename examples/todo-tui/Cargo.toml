[package]
name = "todo-tui"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
guinea = { path = "../../crates/guinea", default-features = false, features = ["own-runtime", "ratatui"] }
todo-core = { path = "../todo-core" }
ratatui = "0.30"
anyhow = "1"

[profile.dev]
debug = 0
incremental = false
codegen-units = 256

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 0

[profile.release]
debug = 0

[profile.bench]
debug = 0
