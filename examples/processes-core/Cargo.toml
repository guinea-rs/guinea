[package]
name = "processes-core"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace, like the front ends that link it: the examples are built
# on their own, against a guinea taken from the parent directory rather than
# from the workspace that develops it.
[workspace]

[dependencies]
# No backend: this crate is the half of the example that does not draw. It
# builds under `--no-default-features` precisely because a terminal front end
# has to link it too.
guinea = { path = "../../crates/guinea", default-features = false }
guinea-plugin-store = { git = "https://github.com/guinea-rs/guinea-plugins", tag = "v0.14.2" }
guinea-plugin-l10n = { git = "https://github.com/guinea-rs/guinea-plugins", tag = "v0.14.2" }
# For `RingSeries` only, which is plain data - the drawing half of the widget
# crate stays behind its `winui` feature and is not pulled in here.
guinea-widgets = { git = "https://github.com/guinea-rs/guinea-plugins", tag = "v0.14.2", default-features = false }
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
guinea-plugin-l10n-build = { git = "https://github.com/guinea-rs/guinea-plugins", tag = "v0.14.2" }

# The plugins take guinea from crates.io; this takes it from the tree it sits
# in, so both are the one guinea.
[patch.crates-io]
guinea = { path = "../../crates/guinea" }
guinea-app = { path = "../../crates/guinea-app" }
guinea-codegen = { path = "../../crates/guinea-codegen" }
guinea-core = { path = "../../crates/guinea-core" }
guinea-macros = { path = "../../crates/guinea-macros" }
guinea-mark = { path = "../../crates/guinea-mark" }
guinea-meta = { path = "../../crates/guinea-meta" }
guinea-meta-build = { path = "../../crates/guinea-meta-build" }
guinea-route-dsl = { path = "../../crates/guinea-route-dsl" }
guinea-router = { path = "../../crates/guinea-router" }
guinea-trace = { path = "../../crates/guinea-trace" }
