[package]
name = "todo-core"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
guinea = { path = "../../crates/guinea", default-features = false, features = ["own-runtime"] }
anyhow = "1"
amethystate = { version = "0.27", features = ["json"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time", "sync"] }

[dev-dependencies]
tempfile = "3"
guinea = { path = "../../crates/guinea", default-features = false, features = ["own-runtime", "test-utils"] }

[profile.dev]
debug = 0
incremental = false
codegen-units = 256

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 0

[profile.release]
debug = 0

[profile.bench]
debug = 0
