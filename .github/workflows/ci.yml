name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancels a stale run when new commits land on the same branch/PR - avoids
# burning CI minutes on a build for a diff that's already been superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The whole workspace, including the backend. Windows-only because
  # `guinea-winui` (and `guinea`, which re-exports it) pull in the
  # `windows-reactor` fork and the `windows` crate.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'

      # Mandatory, not an optimisation: `windows-reactor` comes from a rev
      # pin on the windows-rs fork, and that repo is large enough that the
      # very first `cargo fetch` takes minutes. rust-cache restores
      # ~/.cargo/git alongside the registry and target dir, so subsequent
      # runs skip the clone entirely.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Validate Perfetto export with the official Trace Processor
        shell: pwsh
        run: |
          $processor = Join-Path $env:RUNNER_TEMP 'trace_processor_shell.exe'
          Invoke-WebRequest 'https://commondatastorage.googleapis.com/perfetto-luci-artifacts/v59.1/windows-amd64/trace_processor_shell.exe' -OutFile $processor
          $expected = '3acc5aca1c764541033a82ba3bb0a47524b5c3c0aa194eea8d9a7b0cdb346bdc'
          if ((Get-FileHash $processor -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Trace Processor checksum mismatch'
          }
          $env:TRACE_PROCESSOR = $processor
          cargo test --locked -p guinea-trace --features perfetto,allocations -- --include-ignored

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Perfetto UI package and SQL integration
        shell: pwsh
        run: |
          npm ci --prefix tools/perfetto
          npm --prefix tools/perfetto run typecheck
          npm --prefix tools/perfetto run format:check
          $env:TRACE_PROCESSOR = Join-Path $env:RUNNER_TEMP 'trace_processor_shell.exe'
          $env:GUINEA_TEST_TRACE = Join-Path $env:RUNNER_TEMP 'guinea-ui-test.pftrace'
          cargo run --locked -p guinea-trace --features perfetto,allocations --example perfetto_allocations -- $env:GUINEA_TEST_TRACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GUINEA_EVENT_TEST_TRACE = Join-Path $env:RUNNER_TEMP 'guinea-event-only.pftrace'
          cargo run --locked -p guinea-trace --features perfetto --example perfetto -- $env:GUINEA_EVENT_TEST_TRACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix tools/perfetto test

      - name: Test guinea-core without the workspace's features
        run: cargo test -p guinea-core

      # The book shows every page on each backend it documents; the facade's
      # default build has only WinUI, so the egui examples are run here.
      - name: Book examples on egui
        run: cargo test -p guinea --features eframe,harness --test book_pages_egui --test book_composition_egui --test book_dependencies_egui

      # The examples in the README and in doc comments are copied from tests
      # by `cargo xtask docs`; a page edited by hand, or a test changed without
      # it, fails here.
      - name: Docs match their tests
        run: cargo xtask docs --check

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The vendored window, reactor and canvas are published in the same run
      # as the rest, so between a bump and the tag crates.io does not have them
      # yet: packaged against crates/vendor, as publish.yml does.
      - name: Package what publish would
        run: >
          cargo package --workspace --exclude xtask --exclude guinea-slint-fixture --no-verify
          --config .cargo/package.toml

  examples:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - todo-core
          - todo-winui
          - todo-tui
          - todo-egui
          - todo-iced
          - todo-slint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: examples/${{ matrix.example }} -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build
        run: cargo build --locked --manifest-path examples/${{ matrix.example }}/Cargo.toml

      - name: Test
        run: cargo test --locked --manifest-path examples/${{ matrix.example }}/Cargo.toml

      - name: Test the profiling reference application
        if: matrix.example == 'todo-core'
        run: cargo test --locked --manifest-path examples/todo-core/Cargo.toml --features profile

  # The half that claims to know nothing about a toolkit, built where no
  # toolkit exists. This job is the claim's only proof: `guinea-core`,
  # `guinea-app` and `guinea-router` have no Windows dependency in their
  # trees, and if one creeps back in, it fails here rather than in a review.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Test the agnostic crates
        run: >
          cargo test
          -p guinea-core
          -p guinea-app
          -p guinea-router
          -p guinea-macros
          -p guinea-trace
          -p guinea-codegen

      # The facade itself, with the backend feature off - what a port to
      # another toolkit starts from.
      - name: Build the facade without a backend
        run: cargo build -p guinea --no-default-features

      # Everything else as it is: the facade with its default `winui`, which
      # means nothing here, and the eframe and iced adapters, whose windowing
      # backends are what Linux lacked.
      - name: Check the whole workspace
        run: cargo check --workspace --all-targets
