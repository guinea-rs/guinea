[package]
name = "guinea-app"
description = "The part of a guinea application with no toolkit in it: plugins, features, services, actors, timers and teardown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
guinea-core.workspace = true
tracing.workspace = true
anyhow.workspace = true
tokio.workspace = true
serde = { workspace = true, optional = true }

[features]
default = ["own-runtime"]

# Start (and enter) a tokio runtime during install, unless the application
# already brought one. On by default: an application that does not spawn
# anything pays for a runtime it never uses, which is cheaper than every
# application repeating the same two lines - and one that has its own keeps it.
own-runtime = []
# `TestApp` - an application without a window, for crates that write plugins or
# features out of tree and need to install them in a test - and `Harness`,
# which runs what they spawn on the test's thread in an order a seed decides.
test-utils = ["guinea-core/test-utils", "dep:serde"]

[lints]
workspace = true

[dev-dependencies]
guinea-macros.workspace = true
guinea-core = { workspace = true, features = ["test-utils"] }
serde.workspace = true
