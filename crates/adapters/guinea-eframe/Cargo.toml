[package]
name = "guinea-eframe"
description = "guinea on egui: the router and the application runtime, drawn immediately"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
guinea-core.workspace = true
guinea-app.workspace = true
guinea-router.workspace = true
anyhow.workspace = true
eframe = { workspace = true, features = [
    # A renderer has to be named or eframe builds without one; glow is the
    # cheap default and does not pull in wgpu.
    "glow",
    "default_fonts",
] }
egui.workspace = true
tracing.workspace = true

[features]
# The Linux windowing backends: with eframe's defaults off, winit gets neither
# and does not build there. Both, as eframe's own defaults have them; an
# application that wants only one turns these off and names it.
default = ["x11", "wayland"]
x11 = ["eframe/x11"]
wayland = ["eframe/wayland"]

[lints]
workspace = true

[dev-dependencies]
guinea-macros.workspace = true
guinea-core = { workspace = true, features = ["test-utils"] }
