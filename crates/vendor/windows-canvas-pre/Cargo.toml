[package]
name = "windows-canvas-pre"
version = "0.100.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "windows-canvas from microsoft/windows-rs at c14074c45, on windows-reactor-pre, published for guinea until windows-rs releases it"
repository = "https://github.com/guinea-rs/guinea"
categories = ["os::windows-apis"]
readme = "readme.md"

[workspace]

[lib]
name = "windows_canvas"

[features]
default = []
system = ["dep:windows-window"]
reactor = ["dep:windows-reactor"]

[dependencies]
windows-core = { version = "0.100.0", default-features = false }
windows-numerics = { version = "0.100.0", default-features = false }
windows-reactor = { package = "windows-reactor-pre", version = "0.100.0", path = "../windows-reactor-pre", optional = true }
windows-window = { version = "0.100.0", default-features = false, optional = true }

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []
features = ["reactor"]
no-default-features = true
