[package]
name = "windows-reactor-pre"
version = "0.100.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "windows-reactor from microsoft/windows-rs at c14074c45, published for guinea until windows-rs releases it"
repository = "https://github.com/guinea-rs/guinea"
categories = ["os::windows-apis"]
readme = "readme.md"
exclude = [
    "src/core/component_tests.rs",
    "src/core/engine_tests.rs",
    "src/core/pump/tests",
    "src/native/winui/tests.rs",
    "src/test/recording_tests.rs",
]

[workspace]

[lib]
name = "windows_reactor"

[features]
test = []

[dependencies]
rustc-hash = "2"
windows-collections = { version = "0.100.0", default-features = false, features = ["std"] }
windows-core = { version = "0.100.0", default-features = false }
windows-future = { version = "0.100.0", default-features = false }
windows-numerics = { version = "0.100.0", default-features = false }
windows-reference = { version = "0.100.0", default-features = false, features = ["std"] }
windows-threading = { version = "0.100.0", default-features = false }
windows-time = { version = "0.100.0", default-features = false }

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []
