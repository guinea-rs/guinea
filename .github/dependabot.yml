version: 2

updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /examples/processes-core
      - /examples/processes-app
      - /examples/processes-tui
      - /examples/processes-eframe
      - /examples/processes-iced
      - /examples/processes-slint
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "guinea*"
      - dependency-name: "amethystate*"
      - dependency-name: "ogurpchik*"
      - dependency-name: "uniproc-protocol"
      - dependency-name: "uniproc-agent-kit"
      - dependency-name: "guicons*"
      - dependency-name: "shown"
      - dependency-name: "windows-reactor*"
      - dependency-name: "windows-canvas*"
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      actions:
        patterns: ["*"]
