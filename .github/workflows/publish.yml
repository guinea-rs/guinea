name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag matches the workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match [workspace.package].version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Tag is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME is not on master"
            exit 1
          fi

  test:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows
          save-if: false

      - name: Test
        run: cargo test --workspace

  package:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: package
          save-if: false

      - name: Package and build what is about to be published
        run: >
          cargo package --workspace --exclude xtask
          --config "patch.crates-io.windows-reactor-pre.path='crates/vendor/windows-reactor-pre'"
          --config "patch.crates-io.windows-canvas-pre.path='crates/vendor/windows-canvas-pre'"

  publish:
    needs: [test, package]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -e
          CRATES=(
            vendor/windows-reactor-pre
            vendor/windows-canvas-pre
            guinea-mark
            guinea-meta
            guinea-codegen
            guinea-meta-build
            guinea-route-dsl
            guinea-trace
            guinea-slint-build
            guinea-macros
            guinea-core
            guinea-app
            guinea-router
            guinea-eframe
            guinea-iced
            guinea-ratatui
            guinea-slint
            guinea-winui
            guinea
          )
          for crate in "${CRATES[@]}"; do
            case "$crate" in
              vendor/*) which=(--manifest-path "crates/$crate/Cargo.toml") ;;
              *) which=(-p "$crate") ;;
            esac
            echo "::group::cargo publish $crate"
            failures=0
            while true; do
              if out=$(cargo publish "${which[@]}" --allow-dirty --no-verify 2>&1); then
                echo "$out"
                break
              fi
              echo "$out"
              if echo "$out" | grep -q "already exists"; then
                echo "$crate is already on crates.io"
                break
              fi
              if echo "$out" | grep -q "429 Too Many Requests"; then
                echo "crates.io takes one new crate per 10 minutes; waiting"
                sleep 600
                continue
              fi
              failures=$((failures + 1))
              if [ "$failures" -eq 3 ]; then
                echo "::error::Failed to publish $crate after 3 attempts"
                exit 1
              fi
              sleep 20
            done
            echo "::endgroup::"
          done
