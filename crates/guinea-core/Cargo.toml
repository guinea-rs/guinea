[package]
name = "guinea-core"
description = "guinea's core: actors, reducers, scopes and the event bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
guinea-mark.workspace = true
guinea-trace.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
derive_more = { workspace = true, features = ["deref", "display", "from"] }
futures-core.workspace = true
inventory.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
guinea-macros.workspace = true
tokio = { workspace = true, features = ["test-util"] }
criterion.workspace = true

[[bench]]
name = "send"
harness = false

[[bench]]
name = "publish"
harness = false

[features]
# The test queue for `invoke_on_ui`, and the seeded executor whose clock is a
# paused tokio runtime - which is tokio's `test-util`.
test-utils = ["tokio/test-util"]



