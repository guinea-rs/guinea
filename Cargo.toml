[workspace.package]
version = "0.23.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/guinea-rs/guinea"

[workspace]
resolver = "2"
members = [
    "crates/guinea-trace",
    "crates/guinea-mark",
    "crates/guinea-meta",
    "crates/guinea-meta-build",
    "crates/guinea-codegen",
    "crates/guinea-core",
    "crates/guinea-app",
    "crates/adapters/guinea-eframe",
    "crates/adapters/guinea-iced",
    "crates/adapters/guinea-ratatui",
    "crates/adapters/guinea-slint",
    "crates/adapters/guinea-slint-build",
    "crates/guinea-router",
    "crates/adapters/guinea-winui",
    "crates/guinea-macros",
    "crates/guinea-route-dsl",
    "crates/guinea",
    "xtask",
]
exclude = ["crates/vendor"]

[workspace.dependencies]
guinea-trace = { path = "crates/guinea-trace", version = "0.23.0" }
guinea-mark = { path = "crates/guinea-mark", version = "0.23.0" }
guinea-meta = { path = "crates/guinea-meta", version = "0.23.0" }
guinea-meta-build = { path = "crates/guinea-meta-build", version = "0.23.0" }
guinea-codegen = { path = "crates/guinea-codegen", version = "0.23.0" }
guinea-core = { path = "crates/guinea-core", version = "0.23.0" }
guinea-app = { path = "crates/guinea-app", version = "0.23.0" }
guinea-eframe = { path = "crates/adapters/guinea-eframe", version = "0.23.0" }
guinea-iced = { path = "crates/adapters/guinea-iced", version = "0.23.0" }
guinea-ratatui = { path = "crates/adapters/guinea-ratatui", version = "0.23.0" }
guinea-slint = { path = "crates/adapters/guinea-slint", version = "0.23.0" }
guinea-slint-build = { path = "crates/adapters/guinea-slint-build", version = "0.23.0" }
guinea-router = { path = "crates/guinea-router", version = "0.23.0" }
guinea-winui = { path = "crates/adapters/guinea-winui", version = "0.23.0" }
guinea-macros = { path = "crates/guinea-macros", version = "0.23.0" }
guinea-route-dsl = { path = "crates/guinea-route-dsl", version = "0.23.0" }
guinea = { path = "crates/guinea", version = "0.23.0" }
inventory = "0.3"

# --- UI Stack (Windowing) ---
window-vibrancy = "0.7.1"
raw-window-handle = "0.6.2"

# --- UI Stack (windows-reactor) ---
# windows-rs at 726257f13 has the reactor guinea is written against, and
# crates.io does not: its windows-reactor 0.100.0 is older. The reactor and the
# canvas at that rev are published from crates/vendor as `-pre` crates, under
# their own lib names, on the rest of the windows-rs 0.100 family from
# crates.io - so guinea-winui can be published too.
windows-reactor = { package = "windows-reactor-pre", version = "0.101.0", path = "crates/vendor/windows-reactor-pre" }
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "726257f13" }
windows-canvas = { package = "windows-canvas-pre", version = "0.101.0", path = "crates/vendor/windows-canvas-pre" }
windows-core = "0.100.0"

# --- Async ---
tokio = { version = "1.49.0", features = ["full"] }

# --- Serialization & Data ---
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.0", features = ["v4"] }

# --- Logging & Diagnostics ---
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# --- System & Platform ---
windows = { version = "0.61.3", features = [
    "Win32_UI_Controls", "Win32_Graphics_Dwm", "Win32_UI_Shell",
    "Win32_Storage", "Win32_Storage_FileSystem", "Win32_System_Performance",
    "Win32_NetworkManagement", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock", "Win32_System_Threading", "UI",
    "UI_ViewManagement", "Win32_System_Hypervisor", "Management", "Management_Deployment",
    "ApplicationModel", "ApplicationModel_Core", "Win32_Storage_Packaging", "Win32_Storage_Packaging_Appx", "Win32_System_Services",
] }

# --- Utilities ---
anyhow = "1.0.100"
arc-swap = "1.7.1"
derive_more = "2.1.1"
toml = "0.9.8"
walkdir = "2.5.0"
strsim = "0.11"
fluent-syntax = "0.12.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
split-debuginfo = "packed"

[profile.dev]
debug = 1
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = 0
