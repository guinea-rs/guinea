[workspace.package]
version = "0.12.0"
edition = "2024"

[workspace]
resolver = "2"
members = [
    "crates/guinea-trace",
    "crates/guinea-mark",
    "crates/guinea-codegen",
    "crates/guinea-core",
    "crates/guinea-app",
    "crates/adapters/guinea-eframe",
    "crates/adapters/guinea-iced",
    "crates/adapters/guinea-ratatui",
    "crates/adapters/guinea-slint",
    "crates/adapters/guinea-slint-build",
    "crates/guinea-router",
    "crates/adapters/guinea-winui",
    "crates/guinea-macros",
    "crates/guinea-route-dsl",
    "crates/guinea",
    "xtask",
]

[workspace.dependencies]
guinea-trace = { path = "crates/guinea-trace" }
guinea-mark = { path = "crates/guinea-mark" }
guinea-codegen = { path = "crates/guinea-codegen" }
guinea-core = { path = "crates/guinea-core" }
guinea-app = { path = "crates/guinea-app" }
guinea-eframe = { path = "crates/adapters/guinea-eframe" }
guinea-iced = { path = "crates/adapters/guinea-iced" }
guinea-ratatui = { path = "crates/adapters/guinea-ratatui" }
guinea-slint = { path = "crates/adapters/guinea-slint" }
guinea-slint-build = { path = "crates/adapters/guinea-slint-build" }
guinea-router = { path = "crates/guinea-router" }
guinea-winui = { path = "crates/adapters/guinea-winui" }
guinea-macros = { path = "crates/guinea-macros" }
guinea-route-dsl = { path = "crates/guinea-route-dsl" }
guinea = { path = "crates/guinea" }
inventory = "0.3"

# --- UI Stack (Windowing) ---
window-vibrancy = "0.7.1"
raw-window-handle = "0.6.2"

# --- UI Stack (windows-reactor) ---
# Pinned to an explicit rev (not just `git = "..."`) so this and
# examples/processes-app's separate workspace/lockfile can't silently drift
# onto different commits of the same crate - they did, until this was added.
#
# Upstream rather than the fork since #4848, which did not extend the reactor
# but replaced it: `RenderCx` and its hooks, `Element`, `component()`,
# `ContextId`, `App::new().render()` and `on_exit` are all gone, and a window
# is now a component root. The fork's own commit sits on files that rewrite
# touched, so it has to be redone against the new shape either way.
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45" }
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45" }
windows-canvas = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45" }
windows-core = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45" }

# --- Async ---
tokio = { version = "1.49.0", features = ["full"] }

# --- Serialization & Data ---
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.0", features = ["v4"] }

# --- Logging & Diagnostics ---
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# --- System & Platform ---
windows = { version = "0.61.3", features = [
    "Win32_UI_Controls", "Win32_Graphics_Dwm", "Win32_UI_Shell",
    "Win32_Storage", "Win32_Storage_FileSystem", "Win32_System_Performance",
    "Win32_NetworkManagement", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock", "Win32_System_Threading", "UI",
    "UI_ViewManagement", "Win32_System_Hypervisor", "Management", "Management_Deployment",
    "ApplicationModel", "ApplicationModel_Core", "Win32_Storage_Packaging", "Win32_Storage_Packaging_Appx", "Win32_System_Services",
] }

# --- Utilities ---
anyhow = "1.0.100"
arc-swap = "1.7.1"
derive_more = "2.1.1"
toml = "0.9.8"
walkdir = "2.5.0"
strsim = "0.11"
fluent-syntax = "0.12.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
split-debuginfo = "packed"

[profile.dev]
debug = 1
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = 0
